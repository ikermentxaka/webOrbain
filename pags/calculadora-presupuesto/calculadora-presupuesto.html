<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbain</title>
    <link rel="icon" href="https://assets.bigcartel.com/account_favicons/85266/favicon.png?auto=format&amp;fit=max&amp;h=32&amp;w=32" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/neureEstiloak.css">
    <script async src="/js/analytics.js"></script>
</head>
<body>
  <!--HEADER-->
  <header id="header"><script src="/js/loadHeader.js"></script></header>

  <!--CONTENIDO-->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-11 col-md-8 col-xl-8">
        <section id="calculador-presupuesto" class="calculadora-card">
          <h1 class="calculadora-titulo mb-0">Calculador de presupuesto</h1>
          <p class="opacity-50 mt-0">Última actualización de precios: 27 de Octubre de 2026</p>
          <div class="row g-3 align-items-end">
            <div class="col-12 col-xl-6">
              <label for="cantidad" class="form-label">Cantidad de prendas</label>
              <select id="cantidad" class="form-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </div>
            <div class="col-12 col-xl-6">
              <label for="calidad" class="form-label">Calidad de prendas</label>
              <select id="calidad" class="form-select">
                <option value="orbain">Calidad Orbain</option>
                <option value="normal">Calidad normal (más económico)</option>
              </select>
            </div>
          </div>

          <hr>

          <div class="row g-3">
            <div class="col-12">
              <label for="estampacion" class="form-label">Estampación</label>
              <select id="estampacion" class="form-select">
                <option value="frontal" selected>Frontal</option>
                <option value="ambas">Frontal y trasera</option>
              </select>
            </div>
            <div class="col-12 col-xl-6">
              <label for="tamano-frontal" class="form-label">Tamaño frontal</label>
              <select id="tamano-frontal" class="form-select">
                <option value="pequena">Menor que 25x30cm</option>
                <option value="grande">Mayor que 25x30cm</option>
              </select>
            </div>
            <div id="campo-tamano-trasera" class="col-12 col-sm-6 d-none">
              <label for="tamano-trasera" class="form-label">Tamaño trasera</label>
              <select id="tamano-trasera" class="form-select">
                <option value="pequena">Menor que 25x30cm</option>
                <option value="grande">Mayor que 25x30cm</option>
              </select>
            </div>
          </div>

          <hr>

          <div class="row g-3">
            <div class="col-12 col-xl-6">
              <label for="urgencia" class="form-label">Urgencia</label>
              <select id="urgencia" class="form-select">
                <option value="sin">Sin urgencia - 15 días aprox</option>
                <option value="con">Con urgencia - 5 días aprox</option>
              </select>
            </div>
          </div>

          <hr>

          <div class="calculadora-total">
            <h2>Total</h2>
            <p id="total-texto">Cargando precios...</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <footer id="footer"><script src="/js/loadFooter.js"></script></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="/main.js"></script>
  <script type="module" src="/js/calculadorPresupuesto.js"></script>
</body>
</html>
